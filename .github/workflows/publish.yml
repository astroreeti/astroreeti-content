name: Publish to Instagram
on:
  push:
    paths:
      - "posts/**/publish.json"
  # Scheduled safety net (added 2026-08-05, catch-up ticker since 2026-08-13).
  # HISTORY: v1 was */15 all day (96 runs/day). v2 (2026-08-13 22:33, pushed by
  # the queue-topup automation) widened this to */5 across two ~5h windows plus
  # an all-day */30 backstop -- up to 168 runs/day. That is what burned through
  # $0.34/day gross Actions usage (still $0 billed -- this repo is public, so
  # Actions minutes are free -- but 114 runs by day 15 of the month for ~30
  # actual publish events is a real misconfiguration, not just a cost scare).
  # v3 (2026-08-15): narrow, tight windows around the ONLY two times a post is
  # ever due, at a still-generous */15. The python find-step below already
  # recovers a slot missed entirely by one window on the NEXT day's window
  # (it checks yesterday's unpublished slots too), so no all-day backstop is
  # needed. 20 runs/day total instead of up to 168. (Times are UTC; IST =
  # UTC+5:30.)
  # v4 (2026-08-31, requested by the account owner in the main session): slot
  # times unified to 07:00 and 19:00 IST every day, so followers see posts at
  # the same two times daily. Windows re-centred on those targets; 16 runs/day.
  schedule:
    - cron: "*/15 1-2 * * *"    # IST 06:30-08:15 -> AM slot (07:00 every day)
    - cron: "*/15 13-14 * * *"  # IST 18:30-20:15 -> PM slot (19:00 every day)
  workflow_dispatch:
    inputs:
      post_dir:
        description: "Post folder to publish, e.g. posts/2026-08-06-am"
        required: true

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Find post to publish
        id: find
        run: |
          case "${{ github.event_name }}" in
            push)
              # Original behaviour: publish whatever publish.json this push added.
              DIR=$(git diff --name-only HEAD~1 HEAD | grep -E '^posts/[^/]+/publish\.json$' | head -1 | xargs -r dirname)
              [ -z "$DIR" ] && echo "No new publish.json in this push; nothing to do."
              # Queued-ahead / not-yet-due guard: posts are authored days in
              # advance, and followers are promised two fixed times a day, so a
              # push must NEVER put a post out at some other moment. Defer if
              # the folder is dated in the future, OR is dated today but its own
              # slot time has not arrived yet. The scheduled ticker owns both.
              # (2026-08-31: the date-only version of this guard let a same-day
              # slot pushed at 11:31 IST publish immediately instead of at 19:00.)
              if [ -n "$DIR" ]; then
                DEFER=$(python3 - "$DIR" <<'PYGUARD'
          import datetime, os, re, sys

          IST = datetime.timezone(datetime.timedelta(hours=5, minutes=30))
          now = datetime.datetime.now(IST)
          name = os.path.basename(sys.argv[1])
          m = re.match(r"^(\d{4}-\d{2}-\d{2})-(am|pm)$", name)
          if not m:
              print("no")          # unrecognised folder name: publish as before
              sys.exit(0)
          d = datetime.date.fromisoformat(m.group(1))
          target = 7 * 60 if m.group(2) == "am" else 19 * 60
          if d > now.date():
              print("yes")
          elif d == now.date() and (now.hour * 60 + now.minute) < target:
              print("yes")
          else:
              print("no")
          PYGUARD
                )
                if [ "$DEFER" = "yes" ]; then
                  echo "$DIR is not due yet (IST now $(TZ=Asia/Kolkata date '+%F %H:%M')) - leaving it for the scheduled ticker."
                  DIR=""
                fi
              fi
              ;;
            workflow_dispatch)
              DIR="${{ github.event.inputs.post_dir }}"
              ;;
          schedule)
            # Catch-up ticker (every 15 min, see cron above): pick the
            # earliest slot for "today" (IST) whose target time has passed
            # and that isn't published yet. Prints only the chosen dir (or
            # a blank line) to stdout so it's safe to capture; diagnostics
            # go to stderr so they show in the log without corrupting DIR.
            DIR=$(python3 - <<'PYEOF'
          import datetime, json, os, sys

          IST = datetime.timezone(datetime.timedelta(hours=5, minutes=30))
          now = datetime.datetime.now(IST)
          today = now.date()
          minute_of_day = now.hour * 60 + now.minute

          # Max publish attempts per slot. Without this a post that fails for
          # a structural reason (bad spec, revoked token) is retried by every
          # single tick, forever, hammering the APIs for nothing.
          MAX_ATTEMPTS = 4

          def slots_for(d):
              dow = d.isoweekday()  # 1=Mon .. 7=Sun
              # Uniform daily times, set 2026-08-31 at the account owner's
              # request: 07:00 IST morning, 19:00 IST evening, every day.
              # Sunday no longer has its own later slots; Saturday is still
              # morning-only because no Saturday evening content is ever
              # authored (calendar.json has no Saturday evening entries).
              if dow == 6:      # Saturday: morning slot only
                  return [("am", 7 * 60)]
              return [("am", 7 * 60), ("pm", 19 * 60)]

          def result(date_slot):
              path = f"results/{date_slot}.json"
              if not os.path.exists(path):
                  return {}
              try:
                  return json.load(open(path))
              except Exception:
                  return {}

          def time_sensitive(post_dir):
              try:
                  return bool(json.load(open(f"{post_dir}/publish.json")).get("time_sensitive"))
              except Exception:
                  return False

          # Today's due slots come FIRST, yesterday's missed slots after.
          # Order matters: if a stale post is permanently broken it must never
          # be able to block today's post from going out.
          candidates = [(today, slot, False)
                        for slot, target in slots_for(today)
                        if minute_of_day >= target]
          yesterday = today - datetime.timedelta(days=1)
          candidates += [(yesterday, slot, True) for slot, _ in slots_for(yesterday)]

          chosen = ""
          for d, slot, is_recovery in candidates:
              date_slot = f"{d.isoformat()}-{slot}"
              post_dir = f"posts/{date_slot}"
              res = result(date_slot)

              if not os.path.isdir(post_dir):
                  if not is_recovery:
                      print(f"::warning::Queue gap - nothing authored for {post_dir}",
                            file=sys.stderr)
                  continue
              if res.get("status") == "published":
                  continue
              if int(res.get("attempts", 0)) >= MAX_ATTEMPTS:
                  print(f"::warning::{date_slot} has failed {res.get('attempts')} times "
                        f"({res.get('error', 'see results')}) - giving up, needs a look",
                        file=sys.stderr)
                  continue
              if is_recovery:
                  # A missed slot is recovered the next day, EXCEPT when the
                  # content is pinned to its date (transit posts): publishing
                  # "this week's transits" a day late means publishing
                  # something false.
                  if time_sensitive(post_dir):
                      print(f"::warning::{date_slot} missed its slot and is time-sensitive "
                            f"- skipping rather than publishing stale transit claims",
                            file=sys.stderr)
                      continue
                  print(f"::warning::{date_slot} missed its slot yesterday - publishing late",
                        file=sys.stderr)
              chosen = post_dir
              break

          # Queue-depth alarm: shout while there is still time to fix it.
          depth = 0
          probe = today + datetime.timedelta(days=1)
          while all(os.path.isdir(f"posts/{probe.isoformat()}-{s}")
                    for s, _ in slots_for(probe)):
              depth += 1
              probe += datetime.timedelta(days=1)
          if depth < 3:
              print(f"::warning::Publishing queue is only {depth} day(s) deep - "
                    f"author more slots", file=sys.stderr)

          print(chosen)
          PYEOF
            )
            if [ -n "$DIR" ]; then
              echo "Catch-up run -> $DIR"
            fi
            ;;
          esac
          if [ -n "$DIR" ]; then echo "Publishing $DIR"; fi
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Skip if already published
        id: guard
        if: steps.find.outputs.dir != ''
        run: |
          DATE=$(basename "${{ steps.find.outputs.dir }}")
          # Check the TOP-LEVEL status specifically -- a naive grep for the
          # substring "published" anywhere in the file would false-positive
          # on a nested "facebook":{"status":"published"} even when the
          # top-level (Instagram) status is "failed", wrongly skipping a
          # legitimate retry.
          if [ -f "results/$DATE.json" ] && python3 -c "import json,sys; sys.exit(0 if json.load(open('results/$DATE.json')).get('status')=='published' else 1)"; then
            echo "Already published $DATE; skipping."
            echo "go=no" >> "$GITHUB_OUTPUT"
          else
            echo "go=yes" >> "$GITHUB_OUTPUT"
          fi

      # ------------------------------------------------------------------
      # RENDER (added 2026-08-05)
      # The authoring session can no longer run Chromium -- its sandbox blocks
      # the Playwright browser download -- so rendering moved here. If the post
      # folder already contains reel.mp4 this is a no-op, which keeps every
      # historical post and any locally-rendered post working unchanged.
      # ------------------------------------------------------------------
      - name: Check whether a render is needed
        id: render_needed
        if: steps.find.outputs.dir != '' && steps.guard.outputs.go == 'yes'
        run: |
          DIR="${{ steps.find.outputs.dir }}"
          FMT=$(python3 -c "import json;print(json.load(open('$DIR/publish.json')).get('format','reel'))")
          if [ "$FMT" != "reel" ]; then
            echo "Format is '$FMT', not a reel; no render step."
            echo "go=no" >> "$GITHUB_OUTPUT"
          elif [ -f "$DIR/reel.mp4" ]; then
            echo "reel.mp4 already present; skipping render."
            echo "go=no" >> "$GITHUB_OUTPUT"
          elif [ ! -f "$DIR/spec.json" ]; then
            echo "::error::$DIR has neither reel.mp4 nor spec.json - nothing to render or publish."
            exit 1
          else
            echo "go=yes" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.render_needed.outputs.go == 'yes'
        with:
          python-version: "3.11"

      - name: Cache Playwright browser
        if: steps.render_needed.outputs.go == 'yes'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-v1

      - name: Install render toolchain
        if: steps.render_needed.outputs.go == 'yes'
        run: |
          python3 -m pip install --upgrade pip
          pip install playwright
          python3 -m playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fontconfig
          mkdir -p ~/.fonts && cp generator/fonts/*.ttf ~/.fonts/ && fc-cache -f
          echo "Devanagari faces available: $(fc-list | grep -ci devanagari)"

      - name: Render reel
        if: steps.render_needed.outputs.go == 'yes'
        run: |
          DIR="${{ steps.find.outputs.dir }}"
          case "$DIR" in
            *-pm) BG=generator/video/evening_bg.mp4 ;;
            *)    BG=generator/video/morning_bg.mp4 ;;
          esac
          echo "Rendering $DIR over $BG"
          python3 generator/generate_reel_video.py "$DIR/spec.json" "$DIR" "$BG" 4

      - name: Verify render
        if: steps.render_needed.outputs.go == 'yes'
        run: |
          DIR="${{ steps.find.outputs.dir }}"
          test -f "$DIR/reel.mp4"  || { echo "::error::reel.mp4 was not produced"; exit 1; }
          test -f "$DIR/cover.jpg" || { echo "::error::cover.jpg was not produced"; exit 1; }
          DUR=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$DIR/reel.mp4")
          echo "Duration: ${DUR}s"
          python3 -c "import sys; d=float('$DUR'); sys.exit('::error::reel duration %.1fs outside safe 25-59.5s window' % d) if not (25.0 <= d <= 59.5) else print('duration %.1fs OK' % d)"

      - name: Commit rendered media
        if: steps.render_needed.outputs.go == 'yes'
        run: |
          DIR="${{ steps.find.outputs.dir }}"
          git config user.name "astroreeti-bot"
          git config user.email "actions@users.noreply.github.com"
          git add "$DIR/reel.mp4" "$DIR/cover.jpg"
          git commit -m "render $DIR" || echo "nothing to commit"
          git pull --rebase origin main || true
          git push
      # ------------------------- end render ------------------------------

      - name: Publish carousel
        if: steps.find.outputs.dir != '' && steps.guard.outputs.go == 'yes'
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: "17841442486927671"
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: main
        run: python3 scripts/publish.py "${{ steps.find.outputs.dir }}"

      - name: Commit result
        if: always() && steps.find.outputs.dir != '' && steps.guard.outputs.go == 'yes'
        run: |
          git config user.name "astroreeti-bot"
          git config user.email "actions@users.noreply.github.com"
          git add results/
          git commit -m "result for ${{ steps.find.outputs.dir }}" || echo "nothing to commit"
          git pull --rebase origin main || true
          git push
