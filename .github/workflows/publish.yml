name: Publish to Instagram
on:
  push:
    paths:
      - "posts/**/publish.json"
  # Scheduled safety net (added 2026-08-05). Cron is UTC; IST = UTC+5:30.
  # These fire whether or not anyone's desktop app is open, publishing
  # whatever is already queued in posts/<date>-am|pm/.
  schedule:
    - cron: "0 2 * * 1-5"     # 07:30 IST Mon-Fri  -> morning run
    - cron: "30 4 * * 6"      # 10:00 IST Saturday -> single morning run
    - cron: "0 5 * * 0"       # 10:30 IST Sunday   -> morning run
    - cron: "0 14 * * 0-5"    # 19:30 IST Sun-Fri  -> evening run
  workflow_dispatch:
    inputs:
      post_dir:
        description: "Post folder to publish, e.g. posts/2026-08-06-am"
        required: true

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Find post to publish
        id: find
        run: |
          case "${{ github.event_name }}" in
            push)
              # Original behaviour: publish whatever publish.json this push added.
              DIR=$(git diff --name-only HEAD~1 HEAD | grep -E '^posts/[^/]+/publish\.json$' | head -1 | xargs -r dirname)
              [ -z "$DIR" ] && echo "No new publish.json in this push; nothing to do."
              # Queued-ahead guard: posts are now authored days in advance, so a
              # push must NOT fire a post dated in the future -- the scheduled
              # cron owns those. Only same-day-or-earlier folders publish on push.
              if [ -n "$DIR" ]; then
                FOLDER_DATE=$(basename "$DIR" | grep -oE '^[0-9]{4}-[0-9]{2}-[0-9]{2}')
                TODAY_IST=$(TZ=Asia/Kolkata date +%F)
                if [ -n "$FOLDER_DATE" ] && [ "$FOLDER_DATE" \> "$TODAY_IST" ]; then
                  echo "$DIR is queued for $FOLDER_DATE (today IST is $TODAY_IST) - leaving it for the scheduled run."
                  DIR=""
                fi
              fi
              ;;
            workflow_dispatch)
              DIR="${{ github.event.inputs.post_dir }}"
              ;;
            schedule)
              # Slot is implied by the cron that fired: everything before
              # 12:00 UTC is a morning run, 14:00 UTC is the evening run.
              # None of these crons cross midnight IST, so the IST date and
              # the UTC date are the same and a plain date works.
              HOUR=$(date -u +%H)
              if [ "$HOUR" -lt 12 ]; then SLOT=am; else SLOT=pm; fi
              DIR="posts/$(date -u +%Y-%m-%d)-$SLOT"
              echo "Scheduled $SLOT run -> $DIR"
              if [ ! -d "$DIR" ]; then
                echo "::warning::Queue is empty for $DIR - nothing authored for this slot."
                DIR=""
              fi
              ;;
          esac
          if [ -n "$DIR" ]; then echo "Publishing $DIR"; fi
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Skip if already published
        id: guard
        if: steps.find.outputs.dir != ''
        run: |
          DATE=$(basename "${{ steps.find.outputs.dir }}")
          # Check the TOP-LEVEL status specifically -- a naive grep for the
          # substring "published" anywhere in the file would false-positive
          # on a nested "facebook":{"status":"published"} even when the
          # top-level (Instagram) status is "failed", wrongly skipping a
          # legitimate retry.
          if [ -f "results/$DATE.json" ] && python3 -c "import json,sys; sys.exit(0 if json.load(open('results/$DATE.json')).get('status')=='published' else 1)"; then
            echo "Already published $DATE; skipping."
            echo "go=no" >> "$GITHUB_OUTPUT"
          else
            echo "go=yes" >> "$GITHUB_OUTPUT"
          fi

      # ------------------------------------------------------------------
      # RENDER (added 2026-08-05)
      # The authoring session can no longer run Chromium -- its sandbox blocks
      # the Playwright browser download -- so rendering moved here. If the post
      # folder already contains reel.mp4 this is a no-op, which keeps every
      # historical post and any locally-rendered post working unchanged.
      # ------------------------------------------------------------------
      - name: Check whether a render is needed
        id: render_needed
        if: steps.find.outputs.dir != '' && steps.guard.outputs.go == 'yes'
        run: |
          DIR="${{ steps.find.outputs.dir }}"
          FMT=$(python3 -c "import json;print(json.load(open('$DIR/publish.json')).get('format','reel'))")
          if [ "$FMT" != "reel" ]; then
            echo "Format is '$FMT', not a reel; no render step."
            echo "go=no" >> "$GITHUB_OUTPUT"
          elif [ -f "$DIR/reel.mp4" ]; then
            echo "reel.mp4 already present; skipping render."
            echo "go=no" >> "$GITHUB_OUTPUT"
          elif [ ! -f "$DIR/spec.json" ]; then
            echo "::error::$DIR has neither reel.mp4 nor spec.json - nothing to render or publish."
            exit 1
          else
            echo "go=yes" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.render_needed.outputs.go == 'yes'
        with:
          python-version: "3.11"

      - name: Cache Playwright browser
        if: steps.render_needed.outputs.go == 'yes'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-v1

      - name: Install render toolchain
        if: steps.render_needed.outputs.go == 'yes'
        run: |
          python3 -m pip install --upgrade pip
          pip install playwright
          python3 -m playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fontconfig
          mkdir -p ~/.fonts && cp generator/fonts/*.ttf ~/.fonts/ && fc-cache -f
          echo "Devanagari faces available: $(fc-list | grep -ci devanagari)"

      - name: Render reel
        if: steps.render_needed.outputs.go == 'yes'
        run: |
          DIR="${{ steps.find.outputs.dir }}"
          case "$DIR" in
            *-pm) BG=generator/video/evening_bg.mp4 ;;
            *)    BG=generator/video/morning_bg.mp4 ;;
          esac
          echo "Rendering $DIR over $BG"
          python3 generator/generate_reel_video.py "$DIR/spec.json" "$DIR" "$BG" 4

      - name: Verify render
        if: steps.render_needed.outputs.go == 'yes'
        run: |
          DIR="${{ steps.find.outputs.dir }}"
          test -f "$DIR/reel.mp4"  || { echo "::error::reel.mp4 was not produced"; exit 1; }
          test -f "$DIR/cover.jpg" || { echo "::error::cover.jpg was not produced"; exit 1; }
          DUR=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$DIR/reel.mp4")
          echo "Duration: ${DUR}s"
          python3 -c "import sys; d=float('$DUR'); sys.exit('::error::reel duration %.1fs outside safe 25-59.5s window' % d) if not (25.0 <= d <= 59.5) else print('duration %.1fs OK' % d)"

      - name: Commit rendered media
        if: steps.render_needed.outputs.go == 'yes'
        run: |
          DIR="${{ steps.find.outputs.dir }}"
          git config user.name "astroreeti-bot"
          git config user.email "actions@users.noreply.github.com"
          git add "$DIR/reel.mp4" "$DIR/cover.jpg"
          git commit -m "render $DIR" || echo "nothing to commit"
          git pull --rebase origin main || true
          git push
      # ------------------------- end render ------------------------------

      - name: Publish carousel
        if: steps.find.outputs.dir != '' && steps.guard.outputs.go == 'yes'
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: "17841442486927671"
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: main
        run: python3 scripts/publish.py "${{ steps.find.outputs.dir }}"

      - name: Commit result
        if: always() && steps.find.outputs.dir != '' && steps.guard.outputs.go == 'yes'
        run: |
          git config user.name "astroreeti-bot"
          git config user.email "actions@users.noreply.github.com"
          git add results/
          git commit -m "result for ${{ steps.find.outputs.dir }}" || echo "nothing to commit"
          git pull --rebase origin main || true
          git push
